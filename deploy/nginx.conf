# Reverse proxy for the Next.js server (`npm run start`, default port 5173) at https://vfq-review.<company>.com/.
# Next.js routes every URL itself, so there is no index.html fallback: pass everything through.
server {
  listen 80;
  server_name vfq-review.example.internal;   # your internal hostname

  location / {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
